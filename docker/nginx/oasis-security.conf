# ==============================================================================
# NGINX VIRTUALHOST ENDURECIDO PARA OASIS STORE (REEMPLAZA /etc/nginx/http.d/default.conf)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /app/public;

    index index.php;

    server_tokens off;

    # Límite estricto para subida de comprobantes P2P (reemplaza los 100m por defecto)
    client_max_body_size 12m;
    client_body_timeout 60s;

    # Cabeceras de seguridad HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log off;
    error_log  /var/log/nginx/paymenter.app-error.log error;

    sendfile off;

    # REGLA ACTIVA CRÍTICA: Jamás ejecutar scripts dentro de /storage o /uploads
    # (Se evalúa ANTES del bloque general `location ~ \.php$`)
    location ~* ^/(storage|uploads)/.*\.(php|php[0-9]|phtml|phar|pl|py|jsp|asp|sh|cgi)$ {
        deny all;
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # Respetar el límite de 10M/12M definido en 99-oasis-hardening.ini
        fastcgi_param PHP_VALUE "upload_max_filesize = 10M \n post_max_size = 12M \n session.upload_progress.enabled = 0";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
