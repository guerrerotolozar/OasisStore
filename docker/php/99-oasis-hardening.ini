; ==============================================================================
; BLINDAJE PHP - OASIS STORE (CARGADO EN /usr/local/etc/php/conf.d/)
; ==============================================================================

; 1. Desactivar por completo session.upload_progress
session.upload_progress.enabled = 0
session.upload_progress.cleanup = 1

; 2. Ocultar versión de PHP en cabeceras HTTP
expose_php = Off

; 3. Evitar inclusión remota de archivos (RFI)
allow_url_fopen = On
allow_url_include = Off

; 4. Deshabilitar funciones de ejecución de comandos OS sin romper Guzzle (curl_multi_exec)
;    ni comandos internos de Artisan CLI
disable_functions = passthru,shell_exec,system,popen,show_source,pcntl_exec

; 5. Límites seguros para subida de comprobantes de pago (SPEI / Crypto)
file_uploads = On
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 3

; 6. Endurecimiento de cookies de sesión del Dashboard y Portal de Cliente
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"
